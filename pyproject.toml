[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-deal-monitor"
version = "1.0.0"
description = "Monitor cached low flight prices and send WeChat notifications"
requires-python = ">=3.11"
dependencies = ["requests==2.32.4"]

[project.scripts]
flight-monitor = "flight_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
