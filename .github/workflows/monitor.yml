name: 低价机票监控

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只搜索，不推送"
        required: false
        default: false
        type: boolean
      test_notification:
        description: "只测试微信通知"
        required: false
        default: false
        type: boolean
      initialize_baseline:
        description: "扫描全部目标并建立初始基线，不发送降价提醒"
        required: false
        default: false
        type: boolean
      notify_top_10:
        description: "全量扫描并推送当前最便宜的前十条路线"
        required: false
        default: false
        type: boolean
      force_google_flights:
        description: "立即查询Google Flights并推送当前往返低价榜"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flight-deal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 恢复去重状态
        uses: actions/cache/restore@v4
        with:
          path: state
          key: flight-monitor-state-${{ github.run_id }}
          restore-keys: |
            flight-monitor-state-

      - name: 安装依赖
        run: pip install -e .

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

      - name: 测试微信通知
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: python -m flight_monitor.app --test-notification

      - name: 执行监控
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: >-
          python -m flight_monitor.app
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.initialize_baseline) && '--initialize-baseline --scan-all' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.notify_top_10) && '--notify-top 10 --scan-all' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.force_google_flights) && '--force-google-flights' || '' }}

      - name: 保存去重状态
        if: ${{ always() && hashFiles('state/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: flight-monitor-state-${{ github.run_id }}
